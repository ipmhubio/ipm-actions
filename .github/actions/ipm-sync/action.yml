name: "IPM Sync Workspace"
description: "Sync an existing IPM workspace in the given workingfolder."
inputs:
  working-directory:
    description: "Directory where the command should run"
    required: false
    default: "."
  package-name:
    description: "A single specific package name that should be synchronized."
    required: false
    default: ""
  package-names:
    description: "A semicolon-separated list of package names that should be synchronized."
    required: false
    default: ""
  sync-mode:
    description: "Synchronization mode. Valid: Clean, KeepChangesOnly, KeepNewFilesOnly, KeepAllChanges."
    required: false
    default: "KeepAllChanges"
  ipm-version:
    description: "Specific IPM version (without 'v'); empty = latest"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Setup IPM if not available
      id: prep_ipm
      uses: ./.github/actions/prep-ipm
      with:
        version: ${{ inputs.ipm-version }}
        alias-per-version: 'true'

    - name: Verify prerequisites
      shell: pwsh
      env:
        IPM_CLIENT_SECRETS: ${{ env.IPM_CLIENT_SECRETS }}      
      run: |
        $ErrorActionPreference = 'Stop'

        $ipm = '${{ steps.prep_ipm.outputs.alias_path }}'
        if (-not (Test-Path -Path $ipm)) {
          Write-Error "IPM binary not found on: $ipm"
          return;
        }

        if ([String]::IsNullOrEmpty($env:IPM_CLIENT_SECRETS)) {
          Write-Error "No IPM Client Secrets have been passed through environment variables. Make sure that 'IPM_CLIENT_SECRETS' has a valid client secret."
        }

    - name: Run ipm sync
      shell: pwsh
      working-directory: ${{ inputs.working-directory }}
      env:
        IPM_CLIENT_SECRETS: ${{ env.IPM_CLIENT_SECRETS }}
      run: |
        $ErrorActionPreference = 'Stop'

        $ipm = '${{ steps.prep_ipm.outputs.alias_path }}'
        # Validate sync mode
        $validModes = @('Clean','KeepChangesOnly','KeepNewFilesOnly','KeepAllChanges')
        $modeInput  = '${{ inputs.sync-mode }}'
        if (-not $validModes -contains $modeInput) {
          throw "Invalid sync-mode '$modeInput'. Valid options are: $($validModes -join ', ')."
        }

        # Build argument list
        $args = @('--non-interactive', '--mode', $modeInput)

        # Build positional package list
        $pkgArgs = @()

        # Single package-name
        $single = '${{ inputs.package-name }}'
        $multi = '${{ inputs.package-names }}'
        if (-not [string]::IsNullOrWhiteSpace($single)) {
          $pkgArgs += @('--package', $single.Trim())
        }
        elseif (-not [string]::IsNullOrWhiteSpace($multiRaw)) {
          $normalized = $multiRaw -replace ';', ' ' -replace ',', ' '
          $items = $normalized -split '\s+' | ForEach-Object { $_.Trim() } | Where-Object { $_ -ne '' }
          $pkgArgs += '--packages {0}' -f ($items -join " ")
        }

        Write-Host "Starting IPM sync with selected options..."
        if ($pkgArgs.Count -gt 0) {
          & $ipm sync @args @pkgArgs
        } else {
          & $ipm sync @args
        }