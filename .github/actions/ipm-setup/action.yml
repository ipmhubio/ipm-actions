name: "Setup IPM"
description: "Downloads the IPM CLI for the current OS/architecture and exposes it on PATH with a generic alias."
inputs:
  version:
    description: "Specific IPM version (without 'v'); empty = latest"
    required: false
    default: ""
  alias-name:
    description: "Alias to expose on PATH"
    required: false
    default: "ipm"

runs:
  using: "composite"
  steps:
    # 1) Resolve URL and alias
    - id: cfg
      name: Resolve download URL and alias
      shell: pwsh
      run: |
        $version = '${{ inputs.version }}'
        if ([string]::IsNullOrWhiteSpace($version)) {
          $root = 'https://github.com/ipmhubio/ipm/releases/latest/download'
        } else {
          $root = "https://github.com/ipmhubio/ipm/releases/download/$version"
        }

        $os = $env:RUNNER_OS             # Windows | Linux | macOS
        $arch = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString().ToLower()

        switch ($arch) {
          'x86'   { $archNorm = 'x86' }
          'x64'   { $archNorm = 'x64' }
          'arm'   { $archNorm = 'arm' }
          'arm64' { $archNorm = 'arm64' }
          default { throw "Unsupported architecture: $arch" }
        }

        switch ($os) {
          'Windows' {
            switch ($archNorm) {
              'x86'   { $file = 'ipm-win-x86-full.zip' }
              'x64'   { $file = 'ipm-win-x64-full.zip' }
              'arm64' { $file = 'ipm-win-arm64-full.zip' }
              default { throw "Unsupported Windows arch: $archNorm" }
            }
          }
          'Linux' {
            switch ($archNorm) {
              'x64'   { $file = 'ipm-linux-x64-full.tar.gz' }
              'arm'   { $file = 'ipm-linux-arm-full.tar.gz' }
              'arm64' { $file = 'ipm-linux-arm64-full.tar.gz' }
              default { throw "Unsupported Linux arch: $archNorm" }
            }
          }
          'macOS' {
            switch ($archNorm) {
              'x64'   { $file = 'ipm-osx-x64-full.zip' }
              'arm64' { $file = 'ipm-osx-arm64-full.zip' }
              default { throw "Unsupported macOS arch: $archNorm" }
            }
          }
          default { throw "Unsupported OS: $os" }
        }

        $url = "$root/$file"

        "url=$url"                         | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        "alias=${{ inputs['alias-name'] }}"| Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        "os=$os"                           | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

    # 2) Download package to temp and expose paths as outputs
    - id: dl
      name: Download package
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $url = '${{ steps.cfg.outputs.url }}'
        Write-Host "Downloading: $url"

        $tmp  = Join-Path $env:RUNNER_TEMP 'ipmcli'
        $dest = Join-Path $env:RUNNER_TEMP 'ipm-bin'
        New-Item -ItemType Directory -Force -Path $tmp, $dest | Out-Null

        $pkg = Join-Path $tmp 'pkg'
        Invoke-WebRequest -Uri $url -OutFile $pkg

        "pkg=$pkg"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        "dest=$dest" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

    # 3) Extract, alias to generic name, put on PATH, smoke test
    - id: install
      name: Extract and expose on PATH
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $os    = '${{ steps.cfg.outputs.os }}'
        $alias = '${{ steps.cfg.outputs.alias }}'
        $url   = '${{ steps.cfg.outputs.url }}'
        $pkg   = '${{ steps.dl.outputs.pkg }}'
        $dest  = '${{ steps.dl.outputs.dest }}'

        if (-not (Test-Path $pkg)) {
          throw "Package file not found at: $pkg"
        }

        $isZip = $url.ToLower().EndsWith('.zip')
        $isTgz = $url.ToLower().EndsWith('.tar.gz')

        if (Test-Path "$dest") { Remove-Item -Recurse -Force "$dest" }
        New-Item -ItemType Directory -Force -Path "$dest" | Out-Null

        if ($isZip) {
          Expand-Archive -Path $pkg -DestinationPath $dest -Force
        } elseif ($isTgz) {
          tar -xzf $pkg -C $dest
        } else {
          throw "Unsupported archive type for URL: $url"
        }

        if ($os -eq 'Windows') {
          $bin = Get-ChildItem -Path $dest -Recurse -File -Include ipm.exe | Select-Object -First 1
          if (-not $bin) { $bin = Get-ChildItem -Path $dest -Recurse -File -Include *ipm*.exe | Select-Object -First 1 }
          if (-not $bin) { Get-ChildItem -Recurse $dest | Format-Table FullName; throw "ipm.exe not found after extraction." }

          $aliasPath = Join-Path $dest ("$alias.exe")

          if ($aliasPath -ne $bin.FullName) {
            Copy-Item $bin.FullName $aliasPath -Force
          }
        }
        else {
          $bin = Get-ChildItem -Path $dest -Recurse -File -Include ipm | Select-Object -First 1
          if (-not $bin) { $bin = Get-ChildItem -Path $dest -Recurse -File -Include *ipm* | Where-Object { $_.Name -match 'ipm$' } | Select-Object -First 1 }
          if (-not $bin) { Get-ChildItem -Recurse $dest | Format-Table FullName; throw "'ipm' binary not found after extraction." }

          $aliasPath = Join-Path $dest $alias
          if ($aliasPath -ne $bin.FullName) {
            Copy-Item $bin.FullName $aliasPath -Force
          }
          try { chmod +x $aliasPath } catch { }
        }

        # Add to PATH for this job
        $dest | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8