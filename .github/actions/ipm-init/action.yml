name: "IPM Init Workspace"
description: "Initialize a new IPM workspace in the given working folder."
inputs:
  working-directory:
    description: "Directory where the command should run"
    required: false
    default: "."
  ipm-version:
    description: "Specific IPM version (without 'v'); empty = latest"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Check if IPM is available
      id: check-ipm
      shell: pwsh
      run: |
        $ipmFound = Get-Command ipm -ErrorAction SilentlyContinue
        if ($ipmFound) {
          "available=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        } else {
          "available=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        }

    - name: Setup IPM if not available
      if: steps.check-ipm.outputs.available == 'false'
      uses: ./.github/actions/ipm-setup
      with:
        version: ${{ inputs.ipm-version }}

    - name: Verify prerequisites
      shell: pwsh
      run: |
        if (-not (Get-Command ipm -ErrorAction SilentlyContinue)) {
          Write-Error "ipm not found on PATH after setup attempt."
        }

        if ([String]::IsNullOrEmpty($env:IPM_CLIENT_SECRETS)) {
          Write-Error "No IPM Client Secrets have been passed through environment variables. Make sure that 'IPM_CLIENT_SECRETS' has a valid client secret."
        }

    - name: Run ipm init
      shell: pwsh
      working-directory: ${{ inputs.working-directory }}
      run: |
        $ErrorActionPreference = 'Stop'

        Write-Host "Initializing IPM workspace..."
        ipm init --non-interactive
