name: Release

on:
  push:
    branches:
      - main
    paths:
      - '.github/action*/**'
      - '.github/action*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Get PR information
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const commit = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha
            });
            
            const prNumber = commit.data.commit.message.match(/#(\d+)/)?.[1];
            
            if (prNumber) {
              const pr = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: parseInt(prNumber)
              });
              
              core.setOutput('title', pr.data.title);
              core.setOutput('body', pr.data.body || 'No description provided.');
              core.setOutput('number', prNumber);
            } else {
              core.setOutput('title', commit.data.commit.message.split('\n')[0]);
              core.setOutput('body', commit.data.commit.message);
              core.setOutput('number', '');
            }
      
      - name: Create Release
        uses: actions/github-script@v7
        with:
          script: |
            const timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, -5);
            const tagName = `release-${timestamp}`;
            
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tagName,
              name: '${{ steps.pr.outputs.title }}',
              body: '${{ steps.pr.outputs.body }}',
              target_commitish: context.sha
            });
      
      - name: Update v1 tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -fa v1 -m "Update v1 tag to ${{ github.sha }}"
          git push origin v1 --force
